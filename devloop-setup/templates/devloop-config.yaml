# DevLoop Configuration
# This file controls how the devloop skill routes and executes work.
# Generated by devloop-setup — edit freely.

version: 1
initialized: true

# Tech stack — auto-detected, edit if incorrect
tech_stack:
  language: TypeScript
  framework: React
  runtime: Node.js
  package_manager: pnpm

# Commands — auto-detected from manifests
commands:
  test: pnpm test
  typecheck: pnpm typecheck
  lint: pnpm lint
  build: pnpm build
  e2e: npx playwright test

# Risk routing — controls which workflow each risk level uses
# See devloop-setup/references/routing-policy.md for full rules
routing:
  L0:
    workflow: direct
    confirmations: []
  L1:
    workflow: diagnose-tdd-review
    confirmations: [start, complete]
  L2:
    workflow: grill-openspec-apply-verify-archive
    confirmations: [requirement_understanding, plan_and_spec, final_archive]
    # Fast track: when ALL true, merge requirement_understanding + plan_and_spec
    # into a single combined_plan confirmation point.
    fast_track:
      enabled: true
      criteria:
        - single_module_only          # changes confined to one module
        - no_data_model_change        # no schema/migration/entity changes
        - non_breaking_api_only       # see routing.md disambiguation
      merged_confirmation: combined_plan
  L3:
    workflow: grill-with-docs-explore-spec-tickets-openspec-apply-verify-review-archive
    confirmations: [requirement_understanding, plan_and_spec, start_coding, final_archive]

# Escalation factors — ANY of these forces at least L2, potentially L3
# Note: only BREAKING API changes escalate. Non-breaking API changes stay L2.
escalation_factors:
  - data_model_changes
  - breaking_public_api_changes    # renamed: was public_api_changes (ambiguous)
  - permission_payment_privacy_user_data
  - data_migration
  - cross_service_or_module
  - backward_compatibility
  - rollback_requirements
  - high_technical_uncertainty
  - multi_person_or_multi_agent

# Hotfix bypass — for urgent production fixes
hotfix:
  enabled: true
  # Skip grilling + specifying; go straight to implementing with TDD.
  # A retroactive OpenSpec change MUST be created before archiving.
  triggers:
    - user_explicit_hotfix_flag     # user invokes /develop --hotfix
    - urgency_keywords_in_request   # "production down", "P0", "critical bug"
  retroactive_spec_required: true
  block_archive_if_spec_missing: true

# Issue tracker configuration
tracker:
  type: local          # local | github | linear
  publish_automatically: false
  labels:
    ready_for_agent: ready-for-agent
    triage: triage

# Confirmation policy
confirmation:
  # Even in high-automation mode, these checkpoints always pause
  always_pause:
    - requirement_understanding    # After grilling, before creating OpenSpec
    - plan_and_spec                # After OpenSpec artifacts generated
    - final_archive                # Before syncing and archiving
  # L3 only: explicit pause before first code modification
  l3_start_coding: true

# Failure recovery
failure:
  max_consecutive_retries: 3
  on_max_retries: pause_and_report
  test_failure_flow: diagnosing-bugs

# Brownfield strategy
brownfield:
  mode: structured_index_on_demand
  # L0: architecture map created at setup
  # L1: module spec created on first touch
  # L2: specs auto-updated on archive

# Host compatibility
# Do not branch on host names. Use capability flags for runtime behavior.
host_capability:
  # Detect at runtime from host environment
  subagents: true
  background_tasks: true
  auto_skill_trigger: true
  workspace_fs_coordination: true

  fallback:
    # When capability is false, degrade deterministically
    serial_review: true
    sync_pipeline: true
    manual_trigger: true
